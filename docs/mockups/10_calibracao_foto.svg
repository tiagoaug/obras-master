<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760">
<rect width="380" height="760" fill="#111827"/>
<rect width="380" height="60" fill="#000000" opacity="0.6"/>
<text x="20" y="30" fill="#FFFFFF" font-family="Arial" font-size="14">←  Calibrar Escala</text>
<text x="20" y="48" fill="#D1D5DB" font-family="Arial" font-size="10">Passo 1 de 2 — Marque uma medida conhecida</text>

<!-- foto de fundo simulada -->
<rect x="0" y="60" width="380" height="560" fill="#E5E7EB"/>
<g stroke="#9CA3AF" stroke-width="2" fill="none">
<rect x="40" y="120" width="300" height="400"/>
<line x1="40" y1="260" x2="180" y2="260"/>
<line x1="180" y1="120" x2="180" y2="260"/>
<line x1="180" y1="380" x2="340" y2="380"/>
</g>
<text x="60" y="200" fill="#6B7280" font-family="Arial" font-size="11">SALA</text>
<text x="220" y="200" fill="#6B7280" font-family="Arial" font-size="11">QUARTO</text>
<text x="60" y="340" fill="#6B7280" font-family="Arial" font-size="11">3,50</text>

<!-- linha de calibracao desenhada pelo usuario -->
<line x1="40" y1="120" x2="180" y2="120" stroke="#F59E0B" stroke-width="3"/>
<circle cx="40" cy="120" r="8" fill="#F59E0B"/>
<circle cx="180" cy="120" r="8" fill="#F59E0B"/>
<rect x="70" y="95" width="80" height="20" rx="4" fill="#F59E0B"/>
<text x="80" y="110" fill="#111827" font-family="Arial" font-size="11" font-weight="bold">140 px</text>

<!-- painel de input -->
<rect x="16" y="636" width="348" height="100" rx="14" fill="#FFFFFF"/>
<text x="30" y="660" fill="#111827" font-family="Arial" font-size="12">Qual é a medida real dessa linha?</text>
<rect x="30" y="670" width="200" height="40" rx="8" fill="#F4F5F7" stroke="#3B82F6" stroke-width="2"/>
<text x="42" y="696" fill="#111827" font-family="Arial" font-size="14" font-weight="bold">3,50 m</text>
<rect x="240" y="670" width="34" height="40" rx="8" fill="#EFF6FF"/>
<text x="250" y="696" font-family="Arial" font-size="16">🧮</text>
<rect x="284" y="670" width="66" height="40" rx="8" fill="#3B82F6"/>
<text x="298" y="695" fill="#FFFFFF" font-family="Arial" font-size="12">Usar</text>
</svg>
