<text x="30" y="394" fill="#166534" font-family="Arial" font-size="11">  não é necessário calibrar manualmente</text>
<text x="30" y="414" fill="#9CA3AF" font-family="Arial" font-size="10">2 elementos ignorados (camada "cotas")</text>

